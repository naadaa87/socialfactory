<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>예약 · 결제 확인 | 소셜팩토리 건대</title>
  <link rel="stylesheet" href="/css/style.css?v=select-spacing-20261107">
  <link rel="stylesheet" href="/css/meet.css?v=mk-20261121">
  <style>
    .payment-result { max-width: 680px; margin: 70px auto; padding: 32px 24px; }
    .payment-result h1 { font-size: clamp(26px, 5vw, 38px); margin: 20px 0; }
    .payment-result p { line-height: 1.8; }
    .payment-result dl { background: #f4f6f8; padding: 24px; border-radius: 16px; margin: 24px 0; }
    .payment-result dt { font-size: 13px; color: #637083; margin-top: 14px; }
    .payment-result dt:first-child { margin-top: 0; }
    .payment-result dd { margin: 4px 0 0; font-weight: 600; }
    .payment-result .payment-terms { color: var(--muted); font-size: 14px; line-height: 1.65; }
    .payment-policies { display: flex; flex-wrap: wrap; gap: 0 14px; margin-top: 4px; }
    .payment-policies a { display: inline-flex; align-items: center; min-height: 36px; font-size: 13px; }
    .payment-policies a, .payment-text-action { text-decoration: underline; text-underline-offset: 3px; }
    .payment-agreement { display: flex; align-items: flex-start; gap: 10px; margin: 8px 0 16px; font-size: 14px; line-height: 1.65; }
    .payment-agreement input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--blue); }
    .payment-submit { width: 100%; min-height: 52px; border-radius: 12px; box-shadow: none; }
    .payment-submit:disabled { background: var(--blue-dark); cursor: wait; }
    .payment-result .payment-feedback { margin-top: 10px; color: var(--muted); text-align: center; font-size: 14px; line-height: 1.6; }
    .payment-feedback:empty { margin: 0; }
    .payment-fallback { display: flex; margin: 2px auto 0; width: fit-content; }
    .payment-fallback[hidden] { display: none; }
    .payment-support { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 16px; margin-top: 8px; }
    .payment-text-action { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .payment-text-action:hover { color: var(--navy); }
    .payment-text-action:disabled { opacity: .65; cursor: wait; }
    .payment-cancel { display: flex; width: 100%; border-top: 1px solid var(--line); color: #8b3b45; }
    .payment-cancel[hidden] { display: none; }
  </style>
</head>
<body>
<main class="payment-result">
  <a href="/" aria-label="소셜팩토리 홈">SOCIAL FACTORY</a>
  <h1 id="payment-title">예약·결제 상태를 확인하고 있습니다</h1>
  <p id="payment-message" role="status" aria-live="polite">예약 일정과 페이앱 결제 확인 결과를 불러옵니다.</p>
  <dl id="payment-detail" hidden></dl>
  <form id="payment-consent" hidden>
    <p class="payment-terms">공간대관은 준비·정리 시간을 포함해 이용하며, 변경·취소는 담당자에게 요청해 주세요. 독립사무실은 상담에서 확정한 호실·이용기간·납부 조건이 적용됩니다.</p>
    <div class="payment-policies">
      <a href="/pricing#refund" target="_blank" rel="noopener">대관 취소·환불 기준</a>
      <a href="/terms" target="_blank" rel="noopener">이용약관</a>
      <a href="/privacy" target="_blank" rel="noopener">개인정보 처리방침</a>
    </div>
    <label class="payment-agreement"><input type="checkbox" id="payment-agree" required><span>예약·청구 내용과 이용·취소 조건, 페이앱 결제를 위한 정보 처리 안내를 확인했습니다.</span></label>
    <button type="submit" class="btn btn-primary payment-submit" id="payment-open">페이앱으로 결제하기</button>
  </form>
  <p class="payment-feedback" id="payment-feedback" role="status"></p>
  <a class="payment-text-action payment-fallback" id="payment-fallback" hidden>페이앱 결제창 직접 열기</a>
  <div class="payment-support">
    <button type="button" class="payment-text-action" id="payment-reload">상태 다시 확인</button>
    <a href="/contact" class="payment-text-action">예약·결제 문의</a>
    <a href="/shop" class="payment-text-action">예약·구매 안내</a>
  </div>
  <button type="button" class="payment-text-action payment-cancel" id="booking-cancel" hidden>미결제 예약 취소</button>
  <section class="mt-booking" data-meet-booking hidden aria-live="polite"></section>
</main>
<script src="/js/booking-status.js?v=payment-feedback-20261127"></script>
<script src="/js/meet.js?v=mk-20261121" defer></script>
<script defer src="https://choisijun.com/k1.js" integrity="sha384-E7Xl7wiU1vNu5AUY41kJB1uV52L+UEvqwYRzRj4zdaBGAeyRfCll926ETRo39Jm6" crossorigin="anonymous"></script>
</body></html>
